name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The API surface must keep matching the vendored SDK 27 interface.
  api-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: API parity audit (name-level)
        run: |
          python3 scripts/api-audit.py | tee audit.txt
          grep -q "MISSING types: 0" audit.txt
          grep -q "MISSING members (name-level): 0" audit.txt

  # Linux build + offline suites; live suites self-gate on model availability.
  linux:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build --build-tests
      - name: Test (offline suites; live suites self-gate)
        run: swift test
      - name: Signature-level interface diff
        run: |
          apt-get update -qq && apt-get install -y -qq python3 git > /dev/null
          # Scoped library evolution: global -Xswiftc flags would break
          # swift-log/swift-nio, which do not build resiliently.
          bash scripts/emit-interface.sh /tmp/ServerFoundationModels.swiftinterface
          python3 scripts/interface-diff.py \
            reference/FoundationModels-macOS27.swiftinterface /tmp/ServerFoundationModels.swiftinterface

  # Downstream builds must stay cheap: on toolchains with published
  # swift-syntax prebuilts, consumers never compile swift-syntax from source.
  # Guards the two properties that keep that true — the resolved swift-syntax
  # version has prebuilts, and swift-syntax products stay off the library
  # target. Pinned to swift:6.3.2 because prebuilt manifests are published per
  # exact toolchain version (download.swift.org/prebuilts/swift-syntax/).
  consumer-prebuilts:
    runs-on: ubuntu-latest
    container: swift:6.3.2
    steps:
      - uses: actions/checkout@v4
      - name: Consumer build uses prebuilt swift-syntax
        run: bash scripts/consumer-prebuilts-check.sh

  # No hosted macOS job: the package targets the macOS 27 SDK (Xcode 27
  # beta), which GitHub-hosted images do not ship (macos-26 tops out at
  # Xcode 26.x). Darwin coverage runs on the self-hosted macos-parity job.

  # Full parity suite (both libraries, on-device model) runs on macOS 27
  # runners with Apple Intelligence enabled; documented for self-hosted use.
  # Live model-backed validation runs through the OpenRouter bridge harness
  # (integration/openrouter-parity) when OPENROUTER_API_KEY is provided.
  macos-parity:
    if: ${{ false }}  # enable on a self-hosted macos-27 runner
    runs-on: [self-hosted, macos-27]
    steps:
      - uses: actions/checkout@v4
      - name: Full parity suite
        run: swift test --build-system native
